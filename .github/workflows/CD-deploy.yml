name: Deploy site

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Adjust the Node.js version if needed

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tar
          npm install

      # Build the Docusaurus project
      - name: Build Docusaurus
        run: npm run build

      # Compress the build folder into a tar.gz archive
      - name: Compress build folder
        run: tar -czf build.tar.gz build

      # Upload and deploy the build to the VPS
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_PORT: ${{ secrets.VPS_HOST_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_STAGING_PATH: ${{ secrets.VPS_STAGING_PATH }}
        run: |
          echo "Create the .ssh directory if it doesn't exist"
          mkdir -p ~/.ssh

          echo "Install the SSH private key to the .ssh folder"
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "$VPS_KEY" > ~/.ssh/id_rsa

          echo "Add the SSH host to the known_hosts file to avoid host verification prompts"
          ssh-keyscan -p $VPS_HOST_PORT -H $VPS_HOST > ~/.ssh/known_hosts

          echo "Upload the build.tar.gz file to the VPS"
          scp -P $VPS_HOST_PORT build.tar.gz $VPS_USER@$VPS_HOST:$VPS_STAGING_PATH/

          echo "Run the deploy script on the VPS"
          ssh -p $VPS_HOST_PORT -o LogLevel=QUIET $VPS_USER@$VPS_HOST "echo '$VPS_PASSWORD' | sudo -S /$VPS_STAGING_PATH/deploy.sh"

      - name: Clean up
        run: rm -rf ~/.ssh
